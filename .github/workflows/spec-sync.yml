name: Spec sync

# Receiver side of the cross-repo spec synchronisation (design D10).
#
# The published Factuarea OpenAPI document is the single source of truth. This
# workflow detects when it diverges from the spec pinned in this repo
# (spec/openapi.json), regenerates the SDK with Speakeasy, runs the tests, and
# opens a pull request with the diff. It NEVER pushes to main directly — every
# spec change is reviewed.
#
# Triggers:
#   - repository_dispatch (event_type: spec-updated) — pushed by the factuarea
#     repo's CI when the public spec is republished. The emitter is its `SDK
#     Spec Dispatch` workflow, wired on 2026-08-06 (see docs/SPEC_SYNC.md).
#   - workflow_dispatch — manual run from the Actions tab.
#   - schedule — daily fallback so a missed dispatch is still picked up.
#     PAUSED on 2026-09-18; the note below states the measurable condition
#     that authorises putting it back.
#
# `schedule` restored 2026-08-06: published spec 345 paths vs 192 pinned, which
# satisfies the `docs == prod` condition it was paused under on 2026-06-07.
#
# PAUSED schedule since 2026-09-18; reactivate when: the document published at $SPEC_URL declares the same number of operations as spec/openapi.json (654 on both sides once the ERP contract is deployed); count both with the jq of the compare step below.
# `schedule` paused again 2026-09-18, while the ERP surface is regenerated
# here: the document published at $SPEC_URL declares 470 operations over 386
# paths, and this regeneration has re-pinned `spec/openapi.json` to a frozen
# contract of 654 operations over 532 paths (+184). Until that contract is deployed, the published document is
# the older one, so a scheduled run would read the regenerated SDK as drift
# and open a PR that REMOVES the 184 new operations.
#
# Reactivation condition — measurable, and checkable by anyone without this
# context: the spec published at $SPEC_URL declares the SAME number of
# operations as the copy pinned in this repo (654 on both sides once the
# regeneration has landed and the contract is deployed). Count both with the
# same jq the compare step below uses:
#
#   jq '[.paths[] | to_entries[] | select(.key | IN("get","post","put","patch","delete"))] | length' spec/openapi.json
#   curl -fsSL "https://docs.factuarea.com/api/openapi" \
#     | jq '[.paths[] | to_entries[] | select(.key | IN("get","post","put","patch","delete"))] | length'
#
# Measured 2026-09-18: published 470, pinned 654 ⇒ different ⇒ stays paused.
# Equal counts ⇒ restore the
# trigger under `on:`, exactly as it was:
#
#   schedule:
#     - cron: "17 6 * * *"
#
# Different counts ⇒ it stays paused. The workflow was NOT disabled from the
# Actions UI: such a disable leaves no trace in the repo, is not reviewed in a
# pull request and does not survive a restore. Reactivating is the repository
# owner's decision.

on:
  repository_dispatch:
    types: [spec-updated]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  # Single published source of truth for the spec (design D10, task 0.4).
  SPEC_URL: https://docs.factuarea.com/api/openapi

jobs:
  sync:
    name: Detect, regenerate, PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download the published spec
        run: |
          curl --fail --silent --show-error --location \
            -o /tmp/published-openapi.json "$SPEC_URL"
          echo "Downloaded $(wc -c < /tmp/published-openapi.json) bytes."

      # Canonical comparison: the published spec is minified, the pinned spec is
      # pretty-printed, so a raw byte diff is meaningless. We compare a canonical
      # serialisation (jq -S sorts object keys recursively) of both documents.
      #
      # We also strip `x-codeSamples` (jq's `walk` deletes the key at any depth)
      # before comparing. The docs site decorates the published spec with those
      # per-operation usage snippets; the SDK does not need them. Without this,
      # the daily compare would report a (spurious) change every time the docs
      # are republished, opening noisy PRs even when the API is unchanged.
      # `walk` is a jq builtin (jq >= 1.6, present on ubuntu-latest runners).
      - name: Compare canonically
        id: compare
        run: |
          if ! jq empty /tmp/published-openapi.json 2>/dev/null; then
            echo "::error::Published spec is not valid JSON; aborting."
            exit 1
          fi
          jq -S 'walk(if type=="object" then del(."x-codeSamples") else . end)' \
            spec/openapi.json > /tmp/pinned.canonical.json
          jq -S 'walk(if type=="object" then del(."x-codeSamples") else . end)' \
            /tmp/published-openapi.json > /tmp/published.canonical.json
          if cmp -s /tmp/pinned.canonical.json /tmp/published.canonical.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Spec is up to date — nothing to do."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          # Operation counts, not just a boolean: a review needs to tell one new
          # endpoint from a mass withdrawal before opening the diff. `unique`
          # sorts, which is what `comm` requires.
          operation_ids() {
            jq -r '[.paths // {} | to_entries[] | .value
                      | to_entries[]
                      | select(.key | IN("get","post","put","patch","delete"))
                      | .value.operationId // empty]
                    | unique[]' "$1"
          }
          operation_ids spec/openapi.json > /tmp/pinned.ops
          operation_ids /tmp/published-openapi.json > /tmp/published.ops
          added=$(comm -13 /tmp/pinned.ops /tmp/published.ops | wc -l | tr -d ' ')
          removed=$(comm -23 /tmp/pinned.ops /tmp/published.ops | wc -l | tr -d ' ')
          echo "added_ops=${added}" >> "$GITHUB_OUTPUT"
          echo "removed_ops=${removed}" >> "$GITHUB_OUTPUT"
          echo "Spec differs from the pinned copy — regenerating (+${added}/-${removed} operations)."
          {
            echo "### Spec drift"
            echo
            echo "- Added operations: **${added}**"
            echo "- Removed operations: **${removed}**"
            echo
            comm -23 /tmp/pinned.ops /tmp/published.ops \
              | sed 's/^/- removed: `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup PHP 8.2
        if: steps.compare.outputs.changed == 'true'
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2

      - name: Install Speakeasy CLI
        if: steps.compare.outputs.changed == 'true'
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/speakeasy-api/speakeasy/releases/latest/download/speakeasy_linux_amd64.zip \
            -o /tmp/speakeasy.zip
          unzip -o /tmp/speakeasy.zip -d /tmp/speakeasy-cli
          sudo install /tmp/speakeasy-cli/speakeasy /usr/local/bin/speakeasy
          speakeasy --version

      # Pin the new spec pretty-printed, the same way the repo keeps it, so the
      # PR diff is readable. We strip `x-codeSamples` (docs-only per-operation
      # snippets) so the SDK spec never carries them — same exclusion as the
      # canonical comparison above. The Speakeasy run applies the retry-casing
      # overlay automatically (declared in .speakeasy/workflow.yaml).
      - name: Pin the new spec and regenerate
        if: steps.compare.outputs.changed == 'true'
        env:
          SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}
        run: |
          if [ -z "$SPEAKEASY_API_KEY" ]; then
            echo "::error::SPEAKEASY_API_KEY secret is missing; cannot regenerate. Set it in repo secrets."
            exit 1
          fi
          jq 'walk(if type=="object" then del(."x-codeSamples") else . end)' \
            /tmp/published-openapi.json > spec/openapi.json
          speakeasy run --target all --auto-yes --skip-testing

      - name: Install dependencies
        if: steps.compare.outputs.changed == 'true'
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run tests
        if: steps.compare.outputs.changed == 'true'
        run: ./vendor/bin/phpunit --colors=never

      - name: Open a pull request
        if: steps.compare.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          branch: spec-sync/update
          base: main
          commit-message: "chore: sync SDK with updated OpenAPI spec"
          title: "chore: sync SDK with updated OpenAPI spec (+${{ steps.compare.outputs.added_ops }}/-${{ steps.compare.outputs.removed_ops }} ops)"
          author: "Factuarea <info@factuarea.com>"
          committer: "Factuarea <info@factuarea.com>"
          body: |
            Automated spec sync (design D10).

            The published OpenAPI spec at `${{ env.SPEC_URL }}` diverged from the
            pinned `spec/openapi.json`. This PR re-pins the spec and regenerates
            the SDK with Speakeasy (retry-casing overlay applied). Tests passed in
            CI before this PR was opened.

            - Added operations: **${{ steps.compare.outputs.added_ops }}**
            - Removed operations: **${{ steps.compare.outputs.removed_ops }}**

            The removed operations are listed in the run's job summary.

            Review checklist:
            - [ ] Surface diff (new/removed/renamed operations) is intended.
            - [ ] Bump `php.version` in `.speakeasy/gen.yaml` and update
                  `CHANGELOG.md` per the SemVer rules in `docs/VERSIONING.md`.
                  While the SDK is in `0.x` a removed or renamed operation is a
                  **minor**, not a major: `1.0.0` is reserved for the API's GA.
            - [ ] Every removed operation is named in `CHANGELOG.md` together
                  with its replacement.
            - [ ] If the API's `Factuarea-Version` changed, update
                  `FactuareaVersionHook::DEFAULT_VERSION` and call out the
                  behaviour change in the changelog.
          labels: |
            spec-sync
            automated
